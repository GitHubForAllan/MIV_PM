*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6fa;color:#1a1d23;min-height:100vh}
.topbar{background:#1e293b;padding:0 24px;height:64px;display:flex;align-items:center;gap:16px}
.topbar h1{color:#fff;font-size:1.1rem}.topbar .sub{color:#94a3b8;font-size:.85rem}
.wrap{max-width:1000px;margin:32px auto;padding:0 16px}
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:24px;margin-bottom:24px}
.card h2{font-size:1rem;margin-bottom:16px;color:#1e293b}
.info{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:12px 16px;font-size:.88rem;color:#1d4ed8;margin-bottom:16px;line-height:1.7}
.warn{background:#fffbeb;border:1px solid #fcd34d;border-radius:6px;padding:12px 16px;font-size:.88rem;color:#92400e;margin-bottom:16px;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border:none;border-radius:6px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s}
.btn-primary{background:#2563eb;color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-primary:disabled{background:#93c5fd;cursor:not-allowed}
.btn-danger{background:#dc2626;color:#fff}.btn-danger:hover{background:#b91c1c}
.progress-wrap{margin-top:16px;display:none}
.progress-bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:#2563eb;border-radius:99px;transition:width .3s}
.progress-text{font-size:.85rem;color:#6b7280;margin-top:6px}
.log{margin-top:12px;max-height:200px;overflow-y:auto;font-size:.82rem;background:#f8fafc;border:1px solid #e2e5ed;border-radius:6px;padding:10px 12px;line-height:1.7}
.ok{color:#16a34a;font-weight:600}.err{color:#dc2626}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{background:#f1f5f9;padding:8px 10px;text-align:left;border-bottom:2px solid #e2e5ed;white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:7px 10px;border-bottom:1px solid #f1f5f9;vertical-align:top}
tr:hover td{background:#f8fafc}
.tscroll{max-height:420px;overflow-y:auto;border:1px solid #e2e5ed;border-radius:6px}
.badge{display:inline-block;padding:1px 7px;border-radius:99px;font-size:.75rem;font-weight:600}
.b-c{background:#fef3c7;color:#92400e}
.b-h{background:#dbeafe;color:#1e40af}
.b-q{background:#d1fae5;color:#065f46}
.b-e{background:#ede9fe;color:#5b21b6}
.b-x{background:#f3f4f6;color:#374151}
.dup-tag{background:#fee2e2;color:#b91c1c;border-radius:4px;padding:1px 5px;font-size:.72rem;margin-left:4px;font-weight:600}

  for(let i=0;i<docs.length;i+=BATCH){
    const chunk=docs.slice(i,i+BATCH);
    const batch=writeBatch(db);
    chunk.forEach(d=>{batch.update(d.ref,{epe:true});});
    try{
      await batch.commit();
      done+=chunk.length;
      const pct=Math.round(done/docs.length*100);
      pf.style.width=pct+'%';pt.textContent=done+' / '+docs.length+' ('+pct+'%)';
      log.innerHTML+='<span class="ok">✓ 批次 '+(Math.floor(i/BATCH)+1)+'：'+chunk.length+' 筆 EPE 更新成功</span><br>';
      log.scrollTop=log.scrollHeight;
    }catch(e){log.innerHTML+='<span class="err">✗ 錯誤：'+e.message+'</span><br>';}
  }
  log.innerHTML+='<br><span class="ok">🎉 全部 '+docs.length+' 筆 EPE 已設為 true！</span>';
  btn.textContent='✓ 完成';
};

// 批次匯入會直接寫入庫存主檔，需要「工具室系統 → 管理」
let canManage = false;
mivAuthReady.then(user => {
  canManage = user.canManage("toolroom");
  if (canManage) {
    document.getElementById("import-main").style.display = "";
    init();
  } else {
    document.getElementById("no-access").style.display = "";
  }
});
</script>
