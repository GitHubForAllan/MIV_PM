<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>製程巡檢 — 登入</title>
</head>
<body>
  <!-- 製程巡檢系統已改用共用的工號登入（login.html + auth-guard.js），
       這個舊網址僅做轉址，保留是因為可能還有人加到書籤或分享連結。 -->
  <script>
    const returnUrl = new URLSearchParams(location.search).get("return") || "inspection.html";
    location.replace("login.html?redirect=" + encodeURIComponent(returnUrl));
  </script>
</body>
</html>
